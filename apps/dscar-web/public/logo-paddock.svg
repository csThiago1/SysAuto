<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Circle background with purple gradient -->
  <circle cx="32" cy="32" r="30" fill="url(#purpleGrad)" stroke="url(#chromeBorder)" stroke-width="2.5"/>

  <!-- "P" letterform - main stroke -->
  <path d="M22 50 L22 18 C22 18 22 14 26 14 L38 14 C44 14 48 18 48 24 C48 30 44 34 38 34 L30 34 L30 50"
        stroke="url(#chromeP)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Checkered flag squares on the P's bowl -->
  <rect x="33" y="17" width="4" height="4" fill="#1a1a1a" rx="0.5" opacity="0.8"/>
  <rect x="39" y="17" width="4" height="4" fill="#1a1a1a" rx="0.5" opacity="0.8"/>
  <rect x="36" y="21" width="4" height="4" fill="#1a1a1a" rx="0.5" opacity="0.8"/>
  <rect x="33" y="25" width="4" height="4" fill="#1a1a1a" rx="0.5" opacity="0.6"/>
  <rect x="39" y="25" width="4" height="4" fill="#1a1a1a" rx="0.5" opacity="0.6"/>

  <defs>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#9b30ff"/>
      <stop offset="50%" stop-color="#8b20ef"/>
      <stop offset="100%" stop-color="#6a10cf"/>
    </linearGradient>
    <linearGradient id="chromeBorder" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="50%" stop-color="#999"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
    <linearGradient id="chromeP" x1="20" y1="14" x2="50" y2="50">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="40%" stop-color="#d0d0d0"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
  </defs>
</svg>
