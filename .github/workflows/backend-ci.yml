name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paddock
          POSTGRES_PASSWORD: paddock
          POSTGRES_DB: paddock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paddock"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-dummy-secret-key-for-tests-only
      DATABASE_URL: postgres://paddock:paddock@localhost:5432/paddock_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      DEV_JWT_SECRET: ci-dummy-jwt-secret
      FOCUS_NFE_TOKEN: test-token
      FOCUS_NFE_AMBIENTE: homologacao
      FOCUS_NFE_WEBHOOK_SECRET: test-webhook-secret
      CNPJ_EMISSOR: '12345678000195'
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/core/requirements/*.txt

      - name: Install dependencies
        working-directory: backend/core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run pytest
        working-directory: backend/core
        run: pytest --create-db
